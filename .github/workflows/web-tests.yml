name: Web application

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run build
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - run: python scripts/check-runtime-size.py
      - run: python -m unittest discover -s tests/web -v
      - run: node --check public/app.js
      - run: node tests/web/test_upload_limits.cjs
      - run: node tests/web/test_upload_ticket.mjs
      - run: node tests/web/test_api_responses.cjs
      - run: node tests/web/test_image_exports.cjs
      - run: node tests/web/test_zip.cjs | python tests/web/check_zip.py
